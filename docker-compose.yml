# Request path:  browser → gateway → bff → api → postgres
#                                  ↘ frontend (static SPA)
#
# Only `gateway` (and postgres, for local tooling like Prisma Studio) is
# published to the host for browsers. `api` is reachable only on the internal
# Compose network. `bff` is also published on 127.0.0.1:4000 (loopback only)
# so `./start.sh` can run the backend here and Vite's dev server (:5173) on
# the host, whose proxy sends /graphql to localhost:4000.

# Fixed project name, so container and volume names (dailypacer_pgdata) don't
# depend on the checkout's folder name.
name: dailypacer

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dailypacer
      POSTGRES_USER: dailypacer
      POSTGRES_PASSWORD: dailypacer
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailypacer"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://dailypacer:dailypacer@postgres:5432/dailypacer
      API_PORT: "3000"
      NODE_ENV: production
      # Every start: creates this owner if the account doesn't exist
      # (docs/backend/auth.md). Override for anything reachable by others.
      OWNER_EMAIL: ${OWNER_EMAIL:-admin@dailypacer.local}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-dailypaceradmin123}
      OWNER_NAME: ${OWNER_NAME:-Admin}
    expose: ["3000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # node:22-slim has no curl, so the check uses Node's built-in fetch.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  bff:
    build:
      context: .
      dockerfile: docker/bff.Dockerfile
    environment:
      BFF_PORT: "4000"
      API_URL: http://api:3000
      NODE_ENV: production
      # "auto": Secure session cookie only when the request came over HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
    expose: ["4000"]
    # Loopback only: for Vite's dev proxy (./start.sh), not for other machines.
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    expose: ["80"]

  gateway:
    image: nginx:1.31-alpine
    volumes:
      - ./docker/gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on:
      bff:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata:
