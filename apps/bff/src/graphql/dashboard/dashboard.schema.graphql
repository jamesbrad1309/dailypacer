"""
Aggregate gamification stats across all active habits — the top-of-dashboard
summary (level/XP bar, streak count). Points/level formulas live once on the
server (habits/gamification.util.ts) so the frontend never re-derives them.
"""
type DashboardStats {
  totalHabits: Int!
  pausedHabits: Int!
  totalPoints: Int!
  level: Int!
  levelTitle: String!
  """Points already earned toward the next level."""
  pointsIntoLevel: Int!
  """Points needed in total to reach the next level."""
  pointsForNextLevel: Int!
  longestOverallStreak: Int!
  activeStreakCount: Int!
}

"""
The LifeOS level: habit points plus finance XP (25 per category that
finished a month under budget, 100 per savings goal reached, 10 per week
with transactions logged or imported), on the habits' level curve. Each
part is kept so it's clear where the XP came from.
"""
type LifeLevel {
  level: Int!
  levelTitle: String!
  totalXp: Int!
  xpIntoLevel: Int!
  xpForNextLevel: Int!
  """Habit points (DashboardStats.totalPoints)."""
  habitXp: Int!
  financeXp: Int!
  budgetXp: Int!
  goalXp: Int!
  loggingXp: Int!
  underBudget: Int!
  goalsReached: Int!
  loggedWeeks: Int!
}

extend type Query {
  dashboardStats: DashboardStats!
  """`today`: the user's local day (YYYY-MM-DD); only finished months count for budgets."""
  lifeLevel(today: String!): LifeLevel!
}
