enum TaskStatus {
  TODO
  IN_PROGRESS
  DONE
}

"""A list of tasks with a key prefix: "Grocery list" / GRO → GRO-1, GRO-2…"""
type TodoList {
  id: ID!
  name: String!
  """2–6 uppercase letters/digits. Changing it re-keys every task; numbers stay."""
  prefix: String!
  """The number the next task added to (or moved into) this list gets."""
  nextNumber: Int!
  """The Inbox catches tasks added without a list and can't be deleted."""
  isInbox: Boolean!
  position: Float!
  openCount: Int!
  doneCount: Int!
  """Its board columns, left to right."""
  columns: [TodoColumn!]!
  createdAt: String!
}

"""
A board column. Its status is what its tasks' status is, so "done" works
whatever it's called. Every list keeps at least one column per status.
"""
type TodoColumn {
  id: ID!
  listId: ID!
  """Null: show the status's own name ("To do", "In progress", "Done")."""
  name: String
  status: TaskStatus!
  """Left-to-right order."""
  position: Float!
  taskCount: Int!
}

"""A trimmed TodoList, embedded in each task."""
type TaskList {
  id: ID!
  name: String!
  prefix: String!
  isInbox: Boolean!
}

"""A linked task: just enough to show and open it."""
type TaskRef {
  id: ID!
  key: String!
  title: String!
  status: TaskStatus!
}

type Task {
  id: ID!
  """"<list prefix>-<number>", e.g. GRO-12."""
  key: String!
  number: Int!
  listId: ID!
  list: TaskList!
  title: String!
  notes: String
  status: TaskStatus!
  """Its board column (the status is the column's)."""
  columnId: ID!
  position: Float!
  """YYYY-MM-DD it's planned for (any list), or null."""
  plannedFor: String
  """Order within its planned day, for Today."""
  dayPosition: Float!
  """YYYY-MM-DD deadline, separate from the planned day, or null."""
  dueOn: String
  completedAt: String
  createdAt: String!
  """Tasks this one waits for, in any list."""
  blockedBy: [TaskRef!]!
  """Tasks waiting for this one."""
  blocks: [TaskRef!]!
  """True while anything it waits for isn't done."""
  blocked: Boolean!
}

type TodayTasks {
  """Planned for today, from every list."""
  today: [Task!]!
  """Planned for an earlier day and still not done."""
  earlier: [Task!]!
  """Open, due within 3 days or overdue, and not planned for today or earlier."""
  dueSoon: [Task!]!
}

type ListBoard {
  list: TodoList!
  """Every open task, and the most recently completed `doneLimit` done ones."""
  tasks: [Task!]!
  doneTotal: Int!
}

input CreateTodoListInput {
  name: String!
  """Suggested from the name when left out."""
  prefix: String
}

input UpdateTodoListInput {
  name: String
  prefix: String
  position: Float
}

input CreateTaskInput {
  title: String!
  notes: String
  """The Inbox when left out."""
  listId: ID
  plannedFor: String
  dueOn: String
  status: TaskStatus
  """A column of the list; the first column of `status` when left out."""
  columnId: ID
}

"""Only the fields sent change; null clears notes, plannedFor or dueOn."""
input UpdateTaskInput {
  title: String
  notes: String
  plannedFor: String
  dueOn: String
  """Moves it to the first column of that status."""
  status: TaskStatus
  """A column of its (new) list; the status becomes the column's."""
  columnId: ID
  position: Float
  """Order within its planned day (a drag in Today)."""
  dayPosition: Float
  """Moving lists gives the task the new list's next number."""
  listId: ID
}

input CreateTodoColumnInput {
  name: String!
  status: TaskStatus!
}

"""name: null goes back to the status's own name."""
input UpdateTodoColumnInput {
  name: String
  status: TaskStatus
  position: Float
}

type TaskProgressWeek {
  """Monday."""
  weekStart: String!
  completed: Int!
  """With a due date, done on or before it."""
  onTime: Int!
  """With a due date, done after it."""
  late: Int!
  noDueDate: Int!
}

type TaskProgress {
  """Oldest first; the last week is the current one, so far."""
  weeks: [TaskProgressWeek!]!
  """Open tasks past their due date now."""
  overdueNow: Int!
}

extend type Query {
  """Tasks completed per week over the last `weeks` weeks (1–52)."""
  taskProgress(weeks: Int = 12, today: String!): TaskProgress!
  todoLists: [TodoList!]!
  """A suggested free prefix for a list name."""
  suggestListPrefix(name: String!): String!
  listBoard(listId: ID!, doneLimit: Int = 50): ListBoard!
  """`today` is the user's local day."""
  todayTasks(today: String!): TodayTasks!
  taskByKey(key: String!): Task!
  """
  Tasks across every list matching a title, a key (HOME-2) or a number (2):
  open first, then most recently updated. `excludeDependenciesOf` leaves out
  that task and the tasks it already waits for (for picking a dependency).
  """
  searchTasks(query: String!, excludeDependenciesOf: ID, limit: Int = 10): [Task!]!
}

extend type Mutation {
  createTodoList(input: CreateTodoListInput!): TodoList!
  updateTodoList(id: ID!, input: UpdateTodoListInput!): TodoList!
  """Deletes the list and its tasks. Returns its id."""
  deleteTodoList(id: ID!): ID!
  """Adds a column at the right end (10 at most)."""
  createTodoColumn(listId: ID!, input: CreateTodoColumnInput!): TodoColumn!
  """A new status applies to every task in the column."""
  updateTodoColumn(id: ID!, input: UpdateTodoColumnInput!): TodoColumn!
  """
  Its tasks go to the end of `moveTo` (required when it has any). Refused for
  a list's last column of a status. Returns its id.
  """
  deleteTodoColumn(id: ID!, moveTo: ID): ID!
  createTask(input: CreateTaskInput!): Task!
  updateTask(id: ID!, input: UpdateTaskInput!): Task!
  """Returns the deleted task's id."""
  deleteTask(id: ID!): ID!
  """
  Make `taskId` wait for another task, given by id or by key (GRO-12). Refused
  for the task itself, a loop at any depth, or more than 20.
  """
  addTaskDependency(taskId: ID!, dependsOnId: ID, dependsOnKey: String): Task!
  removeTaskDependency(taskId: ID!, dependsOnId: ID!): Task!
}
