type Habit {
  id: ID!
  name: String!
  description: String
  """Lowercased labels for grouping and filtering habits."""
  tags: [String!]!
  icon: String
  color: String
  unit: String
  targetValue: Float
  """Time of day as HH:mm (24h, local time) this habit is meant to happen, for the day-calendar view. Null means anytime."""
  startTime: String
  schedule: JSON!
  metadata: JSON!
  """BUILD: do it. AVOID ("no sugar"): a due day counts as done unless a slip is logged."""
  polarity: HabitPolarity!
  """A time-boxed habit's last day (YYYY-MM-DD); it archives itself after."""
  endDate: String
  """The user's own fields, in order."""
  customFields: [HabitCustomField!]!
  """Set when the habit is ticked from transactions instead of by hand."""
  financeSource: HabitFinanceSource
  """Linked spending categories: shown as the habit's cost (habitSpend). For NO_SPEND, only these break the day; empty counts all spending."""
  financeCategoryIds: [ID!]!
  """SAVINGS_GOAL only: the goal it saves for."""
  savingsGoalId: ID
  archivedAt: String
  pausedAt: String
  paused: Boolean!
  todayEntry: HabitEntry

  """Consecutive due-days (per schedule) successfully logged, counting back from today."""
  currentStreak: Int!
  """Longest run of consecutive successful due-days in the stats window."""
  longestStreak: Int!
  """Successful check-ins in the stats window (see STATS_WINDOW_DAYS)."""
  totalCompletions: Int!
  """Gamification points — see habits/gamification.util.ts."""
  points: Int!
  level: Int!
  levelTitle: String!
  """One entry per day in the stats window, oldest first — for a GitHub-style contribution grid."""
  heatmap: [HeatmapDay!]!

  createdAt: String!
  updatedAt: String!
}

type HeatmapDay {
  date: String!
  completed: Boolean!
  value: Float
  status: HabitDayStatus!
}

enum HabitPolarity {
  BUILD
  AVOID
}

"""A habit whose entries come from finance (docs/finance/habits-integration.md)."""
enum HabitFinanceSource {
  """An avoid habit, slipped on any day money went out (not transfers)."""
  NO_SPEND
  """Done once anything is logged by hand that day, or an account is reconciled."""
  LOGGED_TODAY
  """A savings goal's daily habit: each day's value is what was put aside. Made from the goal, not here."""
  SAVINGS_GOAL
}

"""What a custom field holds; its value is always a string in that shape."""
enum HabitFieldType {
  TEXT
  """A number, e.g. "12.5"."""
  NUMBER
  """Yes or no: "true" or "false"."""
  BOOLEAN
  """One of the field's options."""
  SELECT
  """YYYY-MM-DD."""
  DATE
}

type HabitCustomField {
  label: String!
  type: HabitFieldType!
  """"" when not filled in."""
  value: String!
  """SELECT only: the choices, in order. Empty for every other type."""
  options: [String!]!
}

input HabitCustomFieldInput {
  label: String!
  type: HabitFieldType = TEXT
  value: String!
  """SELECT only."""
  options: [String!]
}

"""How a habit went on a day."""
enum HabitDayStatus {
  """Checked off (an avoid habit: no slip)."""
  DONE
  """A value short of the target."""
  PARTIAL
  """An avoid habit's slip."""
  SLIPPED
  """A past due day not done."""
  MISSED
  """Due today or later, not done yet."""
  DUE
  """A missed day bought back with points."""
  FROZEN
  PAUSED
  """Not due by the schedule (or a day of a "times a week" habit not done)."""
  OFF
  """Before tracking began, or after a time-boxed habit ended."""
  NONE
}

input CreateHabitInput {
  name: String!
  description: String
  tags: [String!]
  icon: String
  color: String
  unit: String
  targetValue: Float
  startTime: String
  schedule: JSON!
  metadata: JSON
  polarity: HabitPolarity
  endDate: String
  customFields: [HabitCustomFieldInput!]
  """Ticks the habit from transactions; NO_SPEND makes it an avoid habit."""
  financeSource: HabitFinanceSource
  """Linked spending categories (the habit's cost); for NO_SPEND, only these break the day."""
  financeCategoryIds: [ID!]
}

input UpdateHabitInput {
  name: String
  description: String
  tags: [String!]
  icon: String
  color: String
  unit: String
  targetValue: Float
  startTime: String
  schedule: JSON
  polarity: HabitPolarity
  """null: open-ended again."""
  endDate: String
  """Replaces the list."""
  customFields: [HabitCustomFieldInput!]
  """Replaces the linked categories; [] unlinks them (a no-spend habit then counts all spending, and is re-derived)."""
  financeCategoryIds: [ID!]
}

enum HabitRecordStatus {
  DONE
  """A value was logged but the check-in wasn't completed."""
  PARTIAL
  NOT_DONE
  """A past due day with no entry."""
  MISSED
  """A finished week under target, for "times a week" habits."""
  MISSED_WEEK
  """An avoid habit's slip."""
  SLIPPED
}

enum HabitRecordFilter {
  ALL
  DONE
  """Entries that weren't completed (partial or not done)."""
  NOT_DONE
  MISSED
}

type HabitRecordWeek {
  start: String!
  end: String!
  done: Int!
  target: Int!
}

"""One row of a habit's records: a stored entry, a missed day, or a missed week."""
type HabitRecord {
  """YYYY-MM-DD; a missed week's last day."""
  date: String!
  status: HabitRecordStatus!
  entry: HabitEntry
  week: HabitRecordWeek
}

type HabitRecordCounts {
  all: Int!
  done: Int!
  notDone: Int!
  missed: Int!
}

type HabitRecordsPage {
  items: [HabitRecord!]!
  """Rows matching the filter, across all pages."""
  total: Int!
  page: Int!
  pageSize: Int!
  counts: HabitRecordCounts!
  """The first tracked day: creation, or an earlier backdated entry."""
  trackedSince: String!
  """True when misses are whole weeks ("times a week" habits)."""
  missesByWeek: Boolean!
}

type WeekdayStat {
  """0 = Monday … 6 = Sunday."""
  weekday: Int!
  due: Int!
  done: Int!
  """done / due (0–1); null when the weekday was never due."""
  rate: Float
}

type CompletionPeriod {
  from: String!
  to: String!
  due: Int!
  done: Int!
  rate: Float
}

"""When a habit gets done or skipped, and whether this month beats last month."""
type HabitInsights {
  """Last twelve weeks, Monday first."""
  weekdays: [WeekdayStat!]!
  """Weekday indexes; null when the pattern is too thin or flat to call."""
  best: Int
  worst: Int
  thisMonth: CompletionPeriod!
  lastMonth: CompletionPeriod!
}

"""What a habit's linked spending categories cost, in the main currency."""
type HabitSpend {
  habitId: ID!
  currency: String!
  thisMonthMinor: Int!
  lastMonthMinor: Int!
}

extend type Query {
  """Every habit with linked spending categories, for `today`'s month (YYYY-MM-DD) and the one before."""
  habitSpend(today: String!): [HabitSpend!]!
  habits: [Habit!]!
  archivedHabits: [Habit!]!
  todayHabits: [Habit!]!
  habit(id: ID!): Habit!
  """
  A page of a habit's check-ins and misses, newest first, paged on the server.
  `today` is the user's local day: today and this week are never missed.
  """
  habitRecords(
    habitId: ID!
    today: String!
    filter: HabitRecordFilter = ALL
    page: Int = 1
    pageSize: Int = 25
  ): HabitRecordsPage!
  """`today` is the user's local day."""
  habitInsights(habitId: ID!, today: String!): HabitInsights!
}

extend type Mutation {
  createHabit(input: CreateHabitInput!): Habit!
  updateHabit(id: ID!, input: UpdateHabitInput!): Habit!
  archiveHabit(id: ID!): Habit!
  unarchiveHabit(id: ID!): Habit!
  """`date`: the user's local day (YYYY-MM-DD) the pause starts; the server's day if omitted."""
  pauseHabit(id: ID!, date: String): Habit!
  """`date`: the user's local day the habit is due again from."""
  resumeHabit(id: ID!, date: String): Habit!
  """Rebuilds a finance-linked habit's entries from the transactions."""
  recomputeDerivedHabitEntries(habitId: ID!): Habit!
}
