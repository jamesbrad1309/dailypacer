"""
Sign-in and people. Sessions are an httpOnly cookie the BFF sets; the API
checks every call against the access rules (ABAC, docs/backend/auth.md).
Errors: UNAUTHENTICATED (not signed in), FORBIDDEN (the rules say no; the
message says why), TOO_MANY_REQUESTS (too many wrong passwords).
"""
enum UserRole {
  """Everything, including managing admins and other owners."""
  OWNER
  """Manages members and viewers, opens the admin dashboard."""
  ADMIN
  """Full use of the app."""
  MEMBER
  """Read-only in the app."""
  VIEWER
}

enum UserStatus {
  ACTIVE
  """Signed up on their own, waiting for an admin's approval."""
  PENDING
  """Turned off by an admin: can't sign in."""
  DISABLED
}

"""What the signed-in user may do, for showing and hiding things. The API enforces it either way."""
type Abilities {
  """Change the app's data (everyone but viewers)."""
  write: Boolean!
  openAdmin: Boolean!
  manageUsers: Boolean!
  """Roles this user may give others."""
  assignableRoles: [UserRole!]!
}

type Me {
  id: ID!
  email: String!
  name: String!
  role: UserRole!
  status: UserStatus!
  abilities: Abilities!
}

type SignUpPayload {
  """Signed in: the first user of an empty database, who becomes its owner."""
  me: Me
  """PENDING for everyone else, until an admin approves them."""
  status: UserStatus!
}

"""What the signed-in user may do to this user."""
type UserPermissions {
  update: Boolean!
  changeRole: Boolean!
  changeStatus: Boolean!
  resetPassword: Boolean!
}

type User {
  id: ID!
  email: String!
  name: String!
  role: UserRole!
  status: UserStatus!
  lastSignInAt: String
  createdAt: String!
  """The signed-in user themself."""
  isSelf: Boolean!
  permissions: UserPermissions!
}

input SignUpInput {
  email: String!
  name: String!
  password: String!
}

input CreateUserInput {
  email: String!
  name: String!
  password: String!
  role: UserRole!
}

"""Only the fields sent change."""
input UpdateUserInput {
  name: String
  role: UserRole
  status: UserStatus
}

extend type Query {
  """Null when not signed in (or the session has ended)."""
  me: Me
  """Owners and admins: pending sign-ups first."""
  users: [User!]!
}

extend type Mutation {
  """Sets the session cookie."""
  signIn(email: String!, password: String!): Me!
  signUp(input: SignUpInput!): SignUpPayload!
  """Ends the session and clears the cookie."""
  signOut: Boolean!
  """Signs out your other sessions."""
  changePassword(currentPassword: String!, newPassword: String!): Boolean!
  createUser(input: CreateUserInput!): User!
  updateUser(id: ID!, input: UpdateUserInput!): User!
  """Sets someone's password and signs them out everywhere."""
  resetUserPassword(id: ID!, password: String!): Boolean!
}
